name: Build release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Test
        run: go test ./...

      - name: Build portable Windows executable
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: "386"
        run: |
          mkdir -p dist/release
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o dist/release/HighwayPursuit-Ultrawide-Patcher.exe .
          cp README.md LICENSE dist/release/
          cd dist/release
          sha256sum HighwayPursuit-Ultrawide-Patcher.exe > SHA256SUMS.txt
          zip -9 ../HighwayPursuit-Ultrawide-Patcher-${GITHUB_REF_NAME}-win-portable.zip ./*

      - name: Upload release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "dist/HighwayPursuit-Ultrawide-Patcher-${{ github.event.release.tag_name }}-win-portable.zip" \
            "dist/release/SHA256SUMS.txt" \
            --clobber
