name: Validate source build

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: Run tests
        run: go test .

      - name: Verify Windows build
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: "386"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-H=windowsgui" -o dist/HighwayPursuit-Ultrawide-Patcher.exe .

      - name: Explain release behavior
        if: github.event_name == 'release'
        run: |
          echo "Source validation completed."
          echo "No pre-built executable is uploaded by this workflow."
          echo "Users can download GitHub's automatic Source code archive and run build.bat."
